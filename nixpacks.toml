# Configuration Nixpacks pour Coolify (OVH)
[phases.setup]
nixPkgs = ["python312", "pkg-config"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = ["python manage.py collectstatic --noinput"]

[start]
cmd = "python manage.py migrate --noinput && gunicorn Codex.wsgi:application --bind 0.0.0.0:8000"
