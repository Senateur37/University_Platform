# Configuration Nixpacks pour Coolify (OVH)
providers = ["python"]

[phases.setup]
nixPkgs = ["...", "curl"]

[phases.build]
cmds = ["SECRET_KEY=build-only python manage.py collectstatic --noinput"]

[start]
cmd = "sh entrypoint.sh gunicorn Codex.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"

