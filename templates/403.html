{% extends 'base.html' %}
{% block title %}Accès Interdit - Campus Codex{% endblock %}

{% block content %}
<section class="container" style="text-align:center;padding:80px 20px;">
  <div style="max-width:500px;margin:0 auto;background:white;padding:40px;border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--line);">
    <span style="font-size:3.5rem;display:block;margin-bottom:14px;">⛔</span>
    <h1 style="font-size:1.8rem;margin-bottom:10px;color:var(--ink);">403 - Accès Refusé</h1>
    <p class="muted" style="line-height:1.6;margin-bottom:24px;">
      Vous n'avez pas les autorisations nécessaires pour accéder à cette ressource ou à cet espace d'administration.
    </p>
    <a href="{% url 'dashboard' %}" class="button primary">← Retourner au Tableau de bord</a>
  </div>
</section>
{% endblock %}
