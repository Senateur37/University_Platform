{% extends 'base.html' %}
{% block title %}Réinitialisation terminée{% endblock %}

{% block content %}
<section class="auth-shell" style="display:flex;justify-content:center;align-items:center;min-height:65vh;padding:24px 16px;">
  <div class="auth-panel" style="width:min(520px, 100%);background:#ffffff;border:1px solid rgba(148,163,184,0.2);border-radius:24px;padding:32px;text-align:center;box-shadow:0 20px 40px rgba(15,23,42,0.1);">
    <span style="font-size:3rem;display:block;margin-bottom:12px;">✅</span>
    <h1 style="font-size:1.6rem;margin-bottom:10px;">Mot de passe réinitialisé !</h1>
    <p class="muted" style="line-height:1.6;font-size:0.92rem;">
      Votre mot de passe a été mis à jour avec succès. Vous pouvez à présent vous connecter avec vos nouveaux identifiants.
    </p>
    <a href="{% url 'login' %}" class="button primary" style="margin-top:20px;display:inline-block;">Se connecter</a>
  </div>
</section>
{% endblock %}
